---
  name: Release
  
  # release.yaml now calls softprops/action-gh-release, which makes the REST
  # call as the job itself, and docker.yaml pushes to GHCR. A reusable workflow
  # only gets what the caller grants, and the whole run is rejected at startup
  # when it asks for more — with no log to explain it — so this has to be the
  # full set docker.yaml declares on its job, not just the obvious two.
  permissions:
    actions: write
    checks: read
    contents: write
    packages: write
    security-events: write
  
  on:
    pull_request:
      branches:
        - main
      types:
        - closed
  
  jobs:
    create-release:
      if: github.event.pull_request.merged == true
      uses: obervinov/_templates/.github/workflows/release.yaml@v4.0.0
  
    build-release-image:
      if: github.event.pull_request.merged == true
      uses: obervinov/_templates/.github/workflows/docker.yaml@v4.0.0
      needs: [create-release]
