---
  name: PR
  
  # pr.yaml opens or updates the pull request for the pushed branch and
  # docker.yaml pushes the PR image to GHCR. A reusable workflow only gets
  # what the caller grants, and the whole run is rejected at startup when it
  # asks for more — with no log and no check to explain it — so this is the
  # full set docker.yaml declares on its job, contents at write rather than
  # read. CodeQL also flags a workflow that leaves the token at its default
  # scope, which is why the block is here at all.
  permissions:
    actions: write
    checks: read
    contents: write
    packages: write
    pull-requests: write
    security-events: write
  
  on:
    push:
      branches:
        - '*'
        - '*/*'
        - '**'
        - '!main'
  
  jobs:    
    pr:
      uses: obervinov/_templates/.github/workflows/pr.yaml@v4.0.0
    pyproject:
      uses: obervinov/_templates/.github/workflows/pyproject.yaml@v4.0.0

    build-pr-image:
      uses: obervinov/_templates/.github/workflows/docker.yaml@v4.0.0
      needs: [pr, pyproject]
