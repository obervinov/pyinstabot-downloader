<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyinstabot Downloader - Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/android-chrome-512x512.png">
    <link rel="stylesheet" href="/static/app.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .login-card { max-width: 400px; width: 100%; padding: 36px 32px; text-align: center; margin-bottom: 0; }
        .login-logo { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; margin-bottom: 14px; }
        .login-card .page-sub { margin: 4px 0 24px; }
        .telegram-login { display: inline-block; min-height: 40px; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 12px; color: var(--text-3); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
        .token-form { display: flex; flex-direction: column; gap: 10px; }
        .token-form .btn { width: 100%; }
        .token-hint { margin-top: 10px; }
        .login-foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
        @media (max-width: 720px) { .login-card { padding: 28px 20px; } }
    </style>
</head>
<body>
    <main class="card login-card">
        <img src="/static/logo.png" alt="Pyinstabot Downloader" class="login-logo">
        <h1 class="page-title">Pyinstabot Downloader</h1>
        <p class="page-sub">Backup your Instagram content to WebDAV storage</p>

        <div class="telegram-login">
            <!-- Telegram Login Widget -->
            <script async src="https://telegram.org/js/telegram-widget.js?22"
                    data-telegram-login="{{ bot_username }}"
                    data-size="large"
                    data-auth-url="/auth/telegram"
                    data-request-access="write">
            </script>
        </div>

        {% if token_enabled %}
        <div class="divider">or</div>
        <form class="token-form" method="post" action="/auth/token">
            <input class="input" type="text" name="token" placeholder="Paste one-time token" autocomplete="off" required />
            <button type="submit" class="btn primary">Login with Token</button>
        </form>
        <p class="token-hint small muted">Press <b>WebUI Access</b> button in the bot to get a one-time token.</p>
        {% endif %}

        <div class="login-foot">
            <p class="small muted">Login with your Telegram account to continue</p>
        </div>
    </main>

    <!-- Optional: JavaScript callback alternative (not used with data-auth-url) -->
    <!--

        // Would need to send user data to /auth/telegram via fetch/ajax

          method: 'POST',

          body: JSON.stringify(user)
        }).then(r => r.json()).then(data => {
          if (data.ok) window.location.href = '/dashboard';
        });
      }
    </script>
    -->

</body>
</html>
