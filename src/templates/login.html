<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Downloader - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 32px;
            font-size: 16px;
        }
        
        .telegram-login {
            display: inline-block;
            margin-top: 16px;
        }
        
        .footer {
            margin-top: 32px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">📸</div>
        <h1>Instagram Downloader</h1>
        <p>Backup your Instagram content to WebDAV storage</p>
        
        <div class="telegram-login">
            <!-- Telegram Login Widget -->
            <script async src="https://telegram.org/js/telegram-widget.js?22"
                    data-telegram-login="{{ bot_username }}"
                    data-size="large"
                    data-auth-url="/auth/telegram"
                    data-request-access="write">
            </script>
        </div>
        
        <div class="footer">
            <p>Login with your Telegram account to continue</p>
        </div>
    </div>

    -->

</body>
</html>
